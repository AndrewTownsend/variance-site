<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support — Variance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="support">
    <a class="back" href="index.html">← Variance</a>

    <h1>Support</h1>
    <p class="support-intro">
      Got a question, found a bug, or have a feature idea? Send a message below and
      we will get back to you by email.
    </p>

    <form id="support-form" novalidate>
      <input type="hidden" name="access_key" value="528d16f8-a999-45a7-bf0c-767ae0f7ce27" />
      <input type="hidden" name="subject" value="Variance support request" />
      <input type="hidden" name="from_name" value="Variance support page" />
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off" />

      <div class="field">
        <label for="name">Name <span class="optional">(optional)</span></label>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name" />
      </div>

      <div class="field">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="message">Message <span class="required">*</span></label>
        <textarea id="message" name="message" rows="6" placeholder="Describe your question or issue…" required></textarea>
      </div>

      <div id="form-error" class="form-msg form-msg--error" hidden></div>

      <button type="submit" id="submit-btn">Send message</button>
    </form>

    <div id="form-success" class="form-success" hidden>
      <p>Message sent — thanks! We'll follow up at your email address.</p>
    </div>
  </main>

  <script>
    const form = document.getElementById('support-form');
    const btn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('form-error');
    const successBox = document.getElementById('form-success');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorBox.hidden = true;

      const email = form.email.value.trim();
      const message = form.message.value.trim();
      if (!email || !message) {
        showError('Please fill in your email address and message.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending…';

      const payload = {};
      new FormData(form).forEach(function (val, key) {
        payload[key] = val;
      });

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(function () { return {}; });
        if (res.ok && data.success) {
          form.hidden = true;
          successBox.hidden = false;
        } else {
          showError(data.message || 'Something went wrong. Please try again.');
          resetBtn();
        }
      } catch {
        showError('Could not send your message. Check your connection and try again.');
        resetBtn();
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.hidden = false;
    }

    function resetBtn() {
      btn.disabled = false;
      btn.textContent = 'Send message';
    }
  </script>
</body>
</html>
